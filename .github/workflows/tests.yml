# Every push: GitHub's machine installs Godot and runs the whole suite (tools/run_par.py), so nothing runs on Nick's PC.
# Godot is installed by the existing action chickensoft-games/setup-godot; window tests render into a virtual screen
# (xvfb) with software graphics (mesa), and audio is the Dummy driver.
name: tests
on:
  push:
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: virtual screen + software graphics
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-vulkan-drivers libgl1-mesa-dri
      - name: import
        run: godot --headless --path . --import || true
      - name: run every suite
        env:
          G: godot
          LOGS: ${{ runner.temp }}/suites
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python3 tools/run_par.py -j 4
      - name: logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-logs
          path: ${{ runner.temp }}/suites
